<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Bitebox</title>
</head>
<body>
    <h1>Contact Us</h1>

      <p>
        <a href="index.html">Home</a>

        <a href="menu.html">Menu</a>
        |
        <a href="about.html">ABOUT</a>

    <hr>
    <h2>Customer Regestration & Google Form</h2>

    <form action="">
        <h3>Customer Information</h3>
        <label for="full name">Full name</label>

        <br>
    <input type="text" id="fullname" name="fullname">
    <br><br>

    <label for="email">Email Address</label>
<br>
<input type="email" id="email" name="email">
<br><br>

<label for="password">Password</label>
<br>
<input type="password" id="password" name="password">
<br><br>

<label for="phone">Phone Number</label>
<br>
<input type="tel" id="phone" name="phone">
<br><br>

<h3>Order Information</h3>

<label for="quantity">Quantity</label>

<br>
<input type="number" id="Quantity" name="Quantity">
<br><br>

<label for="deliverydate">Preferred Delivery Date</label>

<br>
<input type="date" id="deliverydate" name="deliverydate">

<br><br>

<label for="food">Select Food Item</label>

<br>
<select name="food" id="food">
    <option>Veg Pizza</option>
    <option>Cheese Burger</option>
    <option>white Sause Pasta</option>
    <option>Veg Grilled Sandwich</option>
    <option>Chocolate Brownie</option>
</select>

<br><br>

<h3>PAYMENT METHOD</h3>
<input type="radio" id="cash" name="Payment">
<label for="cash">CASH</label>

<br>

<input type="radio" id="card" name="Payment">
<label for="upi">UPI</label>

<br>

<input type="radio" id="card" name="Payment">
<label for="card">CARD</label>

<BR><BR>

    <h3> EXTRAS </h3>

<input type="checkbox" id="cheese" name="extras">
<label for="cheese"> Extra Cheese </label>
<br>

<input type="checkbox" id="drink" name="extras">
<label for="drink"> Cold Drink </label>
<br>

<input type="checkbox" id="dessert" name="extras">
<label for="dessert"> Dessert </label>
<br><br>

<h3>DELIVERY INSTRUCTIONS</h3>

<label for="Address">DELIVERY ADDRESS</label>

<BR>

    <textarea id="Address" name="address" rows="5" cols="40"></textarea>
<br><br>

<input type="submit" value="Place Order">
<input type="reset" value="Clear Form">

    </form>
      
    <h2>
        Visit Our Website
    </h2>

    <a href="www.google.com">Visit Google</a>


    
</body>
</html>
